name: Build APK

# 手动触发为主；同时保留 tag 触发以便日后出正式版
on:
  workflow_dispatch:
    inputs:
      abi:
        description: "只构建哪个 ABI"
        required: false
        default: "arm64-v8a"
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a
          - all
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform 36 + build tools
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify release JSON contract (mapping)
        run: bash scripts/verify_release_contract.sh app/build/outputs/mapping/release/mapping.txt

      - name: Collect APKs
        run: |
          mkdir -p out
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} out/ \;
          ls -la out/
          sha256sum out/*.apk | tee out/SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-zqy-${{ github.run_number }}
          path: out/
          if-no-files-found: error

      - name: Publish to release (fixed tag)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "APK build (latest)"
          body: |
            自动构建产物，含分享功能修复（Direct Share / ClipData）。
            签名：debug keystore（内部测试用，不可覆盖官方签名版）。
            包名：com.mina.legadostudio.zqy（与官方版共存）。
            commit: ${{ github.sha }}
          files: |
            out/*.apk
            out/SHA256SUMS.txt
          fail_on_unmatched_files: true
          draft: false
