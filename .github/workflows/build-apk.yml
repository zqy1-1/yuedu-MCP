name: Build APK

# 手动触发为主；同时保留 tag 触发以便日后出正式版
on:
  workflow_dispatch:
    inputs:
      abi:
        description: "只构建哪个 ABI"
        required: false
        default: "arm64-v8a"
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a
          - all
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 不用 android-actions/setup-android：它在 accept-android-sdk-licenses 时
      # 以非交互方式调用 `sdkmanager --licenses`，卡在 stdin 等待 → 步骤失败。
      # 改为手动装 cmdline-tools + `yes |` 显式接受许可。
      - name: Set up Android SDK (manual)
        run: |
          set -euo pipefail
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          cd "$SDK_ROOT"
          curl -sSLo cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip -d /tmp/cmdline-tools
          mv /tmp/cmdline-tools/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
          rm -f cmdline-tools.zip
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;35.0.0"
          echo "--- installed ---"
          ls "$SDK_ROOT/platforms" "$SDK_ROOT/build-tools"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify release JSON contract (mapping)
        run: bash scripts/verify_release_contract.sh app/build/outputs/mapping/release/mapping.txt

      - name: Collect APKs
        run: |
          mkdir -p out
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} out/ \;
          ls -la out/
          sha256sum out/*.apk | tee out/SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-zqy-${{ github.run_number }}
          path: out/
          if-no-files-found: error

      - name: Publish to release (fixed tag)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "APK build (latest)"
          body: |
            自动构建产物，含分享功能修复（Direct Share / ClipData）。
            签名：debug keystore（内部测试用，不可覆盖官方签名版）。
            包名：com.mina.legadostudio.zqy（与官方版共存）。
            commit: ${{ github.sha }}
          files: |
            out/*.apk
            out/SHA256SUMS.txt
          fail_on_unmatched_files: true
          draft: false
